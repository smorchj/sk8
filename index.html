<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>sk8 — farm demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Barlow+Condensed:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #101216; color: #eee;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none; }
  /* the cursor is out of the way while a trick is held; pointer lock hides it
     for the whole session where the browser grants it */
  body.holding, body.holding #viewport, body.holding canvas { cursor: none; }
  #viewport { position: fixed; inset: 0; }
  canvas { display: block; }

  /* debug HUD (LAW ZERO: we look at real numbers) — hidden unless F3 /
     SK8.hud(true) (owner: the debug should not be visible by default) */
  #hud { position: fixed; left: 12px; top: 12px; z-index: 10; font-size: 12px;
    line-height: 1.5; color: #cfd6e2; background: #0009; padding: 8px 12px;
    border-radius: 8px; pointer-events: none; white-space: pre; display: none; }
  body.debug #hud { display: block; }
  #trickname { position: fixed; top: 10%; left: 0; right: 0; text-align: center;
    z-index: 10; font-size: 34px; font-weight: 800; letter-spacing: .04em;
    color: #fff; text-shadow: 0 2px 12px #000c; opacity: 0; transition: opacity .15s;
    pointer-events: none; }
  #trickname.show { opacity: 1; }

  /* gesture trace overlay */
  #gesture { position: fixed; inset: 0; z-index: 9; pointer-events: none; }

  /* the trick pad hint (lower screen) — touch screens only: on a desktop its
     dashed top edge read as a stray line across the view */
  #padhint { position: fixed; left: 0; right: 0; bottom: 0; height: 42%;
    z-index: 5; pointer-events: none; border-top: 1px dashed #ffffff14;
    background: linear-gradient(#0000, #0e131c66); opacity: .5; display: none; }
  @media (pointer: coarse) { #padhint { display: block; } }
  #padhint span { position: absolute; bottom: 10px; width: 100%; text-align: center;
    font-size: 11px; color: #8b93a3; letter-spacing: .06em; }

  #keys { position: fixed; right: 12px; top: 12px; z-index: 10; font-size: 11px;
    color: #8b93a3; background: #0009; padding: 8px 12px; border-radius: 8px;
    line-height: 1.6; pointer-events: none; white-space: pre; text-align: right; }

  #attrib { position: fixed; right: 12px; bottom: 10px; z-index: 10; font-size: 11px;
    color: #7c8494; pointer-events: none; }

  #loading { position: fixed; inset: 0; display: flex; align-items: center;
    justify-content: center; z-index: 30; background: #101216; color: #9aa1ad;
    font-size: 15px; flex-direction: column; gap: 10px; }

  /* ── the front door: the character creator ───────────────────────────────
     Skate-shop language: grip-tape black, off-white sticker paper, one hot
     pink and one acid yellow. Marker type for the shouting, a condensed
     sans for everything that has to be read. The 3D park stays live behind
     it and the space between the panels is for dragging the camera. */
  #creator { position: fixed; inset: 0; z-index: 40; display: none; pointer-events: none;
    --ink: #0c0d10; --paper: #f2ecdd; --pink: #ff2e88; --acid: #d4ff3a; --mute: #8f95a1;
    --grip: repeating-linear-gradient(45deg, #15171b 0 2px, #101216 2px 4px);
    font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif; color: var(--paper); }
  #creator.open { display: block; }
  #creator > * { pointer-events: auto; }
  #creator::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 40%, transparent 45%, #0006 100%); }
  #creator .cr-word { font-family: "Permanent Marker", "Comic Sans MS", cursive; font-size: 96px; line-height: .9;
    color: var(--paper); letter-spacing: .01em; transform: rotate(-4deg); text-shadow: 4px 4px 0 var(--pink), 0 10px 30px #000a; }
  #creator .cr-hero { position: absolute; left: 34px; top: 22px; }
  #creator .cr-sub { display: inline-block; margin: 14px 0 0 6px; padding: 5px 12px; background: var(--acid); color: var(--ink);
    font-weight: 800; font-size: 16px; letter-spacing: .18em; text-transform: uppercase; transform: rotate(-2deg);
    box-shadow: 3px 3px 0 #000a; }

  #creator .cr-tabs { position: absolute; left: 34px; top: 190px; display: flex; flex-direction: column; gap: 6px; }
  #creator .cr-tabs button { display: flex; align-items: baseline; gap: 10px; min-width: 150px; padding: 10px 14px;
    background: var(--grip); color: var(--paper); border: 1px solid #ffffff14; border-left: 4px solid transparent;
    text-align: left; cursor: pointer; transition: transform .12s, border-color .12s; }
  #creator .cr-tabs button i { font-style: normal; font-size: 11px; color: var(--mute); letter-spacing: .1em; }
  #creator .cr-tabs button b { font-size: 21px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
  #creator .cr-tabs button:hover { transform: translateX(4px); border-left-color: var(--acid); }
  #creator .cr-tabs button.active { border-left-color: var(--pink); background: #f2ecdd; color: var(--ink); transform: translateX(8px) rotate(-1deg); }
  #creator .cr-tabs button.active i { color: #6b6f78; }

  #creator .cr-panel { position: absolute; right: 34px; top: 22px; bottom: 120px; width: min(420px, 44vw);
    background: #0e1013ee; border: 1px solid #ffffff14; box-shadow: 0 30px 60px #000a, inset 0 0 0 1px #0008;
    backdrop-filter: blur(8px); overflow: hidden; }
  #creator .cr-panel::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: var(--grip); }
  #creator .cr-body { position: absolute; inset: 6px 0 0; padding: 18px 22px 22px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #333 transparent; }
  #creator h2 { margin: 0 0 14px; font-family: "Permanent Marker", cursive; font-weight: 400; font-size: 34px; line-height: 1;
    color: var(--paper); transform: rotate(-1.5deg); transform-origin: left; }
  #creator .cr-note { color: var(--mute); font-size: 14px; line-height: 1.35; margin: 10px 0; }
  #creator .cr-row { display: flex; gap: 8px; margin-top: 10px; }

  #creator button { font: inherit; }
  #creator .cr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  #creator .cr-grid button { padding: 0; background: #15171b; border: 2px solid #ffffff10; color: var(--paper); cursor: pointer;
    overflow: hidden; transition: transform .12s, border-color .12s; }
  #creator .cr-grid button:hover { transform: translateY(-2px); border-color: #ffffff40; }
  #creator .cr-grid button.active { border-color: var(--pink); box-shadow: 0 0 0 2px var(--pink), 0 8px 22px #ff2e8855; }
  #creator .cr-grid .pic { display: block; aspect-ratio: 9 / 11; background: #1a1c22; }
  #creator .cr-grid .pic img { display: block; width: 100%; height: 100%; object-fit: cover; }
  #creator .cr-grid .wait { display: block; width: 100%; height: 100%;
    background: linear-gradient(100deg, #1a1c22 30%, #262932 50%, #1a1c22 70%) 0 0/200% 100%; animation: cr-shimmer 1.2s infinite linear; }
  @keyframes cr-shimmer { to { background-position: -200% 0; } }
  #creator .cr-grid .lbl { display: block; padding: 6px 4px; font-size: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; text-align: center; }
  #creator .cr-grid.hair .pic { aspect-ratio: 1; }
  #creator .cr-grid.presets { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
  /* the curtain: down while the crew's portraits are shot on the rider */
  #creator .cr-curtain { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; background: #101216; color: var(--mute); font-size: 15px; letter-spacing: .12em; text-transform: uppercase;
    opacity: 0; pointer-events: none; transition: opacity .15s; }
  #creator .cr-curtain.down { opacity: 1; pointer-events: auto; }

  #creator .cr-name { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  #creator .cr-name span, #creator .cr-slider > span { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); }
  #creator .cr-name input { flex: 1; padding: 10px 12px; background: #15171b; border: 1px solid #ffffff20; color: var(--paper);
    font-family: "Permanent Marker", cursive; font-size: 22px; outline: none; }
  #creator .cr-name input:focus { border-color: var(--acid); }
  #creator .cr-slider { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 10px; margin-top: 14px; }
  #creator .cr-slider.mini { margin-top: 4px; grid-template-columns: 128px 1fr; }
  #creator .cr-slider.mini > span { text-transform: none; letter-spacing: 0; font-size: 14px; color: #c7cbd3; }
  #creator .cr-slider em { grid-column: 2; display: flex; justify-content: space-between; font-style: normal; font-size: 11px; color: var(--mute); letter-spacing: .12em; text-transform: uppercase; }
  #creator input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; background: #2a2e36; outline: none; }
  #creator input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; background: var(--paper);
    border: 3px solid var(--ink); box-shadow: 0 0 0 2px var(--pink); cursor: pointer; transform: rotate(45deg); }
  #creator input[type=range]::-moz-range-thumb { width: 14px; height: 14px; background: var(--paper); border: 3px solid var(--ink); box-shadow: 0 0 0 2px var(--pink); cursor: pointer; }
  #creator .cr-sliders { max-height: 46vh; overflow-y: auto; padding-right: 6px; }

  #creator .cr-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  #creator .cr-chips button, #creator .cr-list button, #creator .cr-ghost { padding: 7px 12px; background: #15171b; color: var(--paper);
    border: 1px solid #ffffff20; cursor: pointer; font-size: 15px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  #creator .cr-chips button.active { background: var(--acid); color: var(--ink); border-color: var(--acid); }
  #creator .cr-list { display: flex; flex-direction: column; gap: 8px; }
  #creator .cr-list button { text-align: left; padding: 14px 16px; font-size: 18px; border-left: 4px solid transparent; }
  #creator .cr-list button.active { border-left-color: var(--pink); background: var(--paper); color: var(--ink); }
  #creator .cr-ghost:disabled { opacity: .35; cursor: default; }
  #creator .cr-ghost.tiny { grid-column: 2; justify-self: start; margin-top: 4px; padding: 3px 8px; font-size: 12px; }

  #creator .cr-swatches { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  #creator .cr-swatches button { width: 34px; height: 34px; background: var(--c); border: 2px solid #0008; cursor: pointer;
    box-shadow: inset 0 0 0 1px #fff2; transform: rotate(45deg) scale(.8); transition: transform .12s; }
  #creator .cr-swatches button:hover { transform: rotate(45deg) scale(.9); }
  #creator .cr-swatches button.active { transform: rotate(0) scale(1); border-color: var(--paper); box-shadow: 0 0 0 2px var(--pink); }
  #creator .cr-swatches.big { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); margin-top: 0; }
  #creator .cr-swatches.big button { width: auto; height: auto; aspect-ratio: 1; transform: none; padding: 0; position: relative;
    background: #15171b; border: 2px solid #ffffff10; overflow: hidden; }
  #creator .cr-swatches.big button img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #creator .cr-swatches.big button span { position: absolute; left: 0; right: 0; bottom: 0; padding: 3px; background: #000a;
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  #creator .cr-swatches.big button:hover { transform: translateY(-2px); }
  #creator .cr-swatches.big button.active { border-color: var(--pink); box-shadow: 0 0 0 2px var(--pink); transform: none; }

  #creator .cr-stance { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #creator .cr-stance button { padding: 22px 14px; background: #15171b; color: var(--paper); border: 2px solid #ffffff14; cursor: pointer; text-align: left; }
  #creator .cr-stance button b { display: block; font-family: "Permanent Marker", cursive; font-weight: 400; font-size: 30px; }
  #creator .cr-stance button span { color: var(--mute); font-size: 14px; letter-spacing: .06em; text-transform: uppercase; }
  #creator .cr-stance button.active { background: var(--paper); color: var(--ink); border-color: var(--pink); transform: rotate(-1.5deg); }
  #creator .cr-stance button.active span { color: #555a63; }

  #creator .cr-skills { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  #creator .cr-skill { display: grid; grid-template-columns: 1fr repeat(5, 30px); gap: 6px; align-items: center; }
  #creator .cr-skill span { font-size: 17px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  #creator .cr-skill button { height: 22px; background: #15171b; border: 1px solid #ffffff20; cursor: pointer; transform: skewX(-12deg); }
  #creator .cr-skill button.on { background: var(--acid); border-color: var(--acid); }
  #creator .cr-skill button:hover { border-color: var(--paper); }

  #creator .cr-go { position: absolute; right: 34px; bottom: 30px; padding: 16px 34px 14px; background: var(--pink); color: #fff;
    border: none; cursor: pointer; transform: rotate(-2deg); box-shadow: 6px 6px 0 var(--ink), 0 20px 40px #ff2e8866;
    transition: transform .12s; }
  #creator .cr-go:hover { transform: rotate(-2deg) scale(1.04); }
  #creator .cr-go span { display: block; font-family: "Permanent Marker", cursive; font-size: 44px; line-height: 1; letter-spacing: .04em; }
  #creator .cr-go small { display: block; margin-top: 4px; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; opacity: .8; }
  #creator .cr-x { position: absolute; left: 34px; bottom: 30px; width: 44px; height: 44px; background: #15171b; color: var(--paper);
    border: 1px solid #ffffff20; font-size: 18px; cursor: pointer; }
  #creator .cr-hint { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); color: var(--mute);
    font-size: 13px; letter-spacing: .2em; text-transform: uppercase; pointer-events: none; }
  #creator .cr-credit { position: absolute; left: 90px; bottom: 44px; font-size: 12px; color: var(--mute); letter-spacing: .04em; }
  #creator.front .cr-credit { left: 34px; }
  /* while the creator is up the game chrome steps back: its own credit line is shown */
  body.creator #creatorbar, body.creator #keys, body.creator #attrib, body.creator #padhint { display: none; }
  #creator .cr-loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; background: #101216; color: var(--mute); font-size: 15px; letter-spacing: .12em; text-transform: uppercase; }
  #creator .cr-err { color: #ff6b6b; font-size: 17px; text-transform: none; letter-spacing: 0; }
  @media (max-width: 900px) {
    #creator .cr-word { font-size: 64px; }
    #creator .cr-tabs { top: 140px; } #creator .cr-tabs button { min-width: 0; padding: 8px 10px; } #creator .cr-tabs button b { font-size: 16px; }
    #creator .cr-panel { width: min(360px, 56vw); bottom: 100px; }
  }

  /* ── in-game: the skater's tag and the menu button, same language ─────── */
  #creatorbar { position: fixed; left: 14px; bottom: 14px; z-index: 20; display: flex; gap: 8px; align-items: center;
    font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif; }
  #creatorbar button { background: #0c0d10cc; color: #f2ecdd; border: 1px solid #ffffff20; padding: 8px 12px; font: inherit;
    font-size: 15px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
  #creatorbar button.active { background: #ff2e88; border-color: #ff2e88; color: #fff; }
  #creatorbar #openCreator { border-left: 4px solid #d4ff3a; }
  #creatorbar #riderTag { padding: 8px 12px; background: #f2ecdd; color: #0c0d10; font-family: "Permanent Marker", cursive; font-size: 18px;
    transform: rotate(-2deg); box-shadow: 3px 3px 0 #000a; }
  #creatorbar #riderTag:empty { display: none; }
  #trickname { font-family: "Permanent Marker", cursive; font-weight: 400; font-size: 54px; letter-spacing: .02em; color: #f2ecdd;
    text-shadow: 4px 4px 0 #ff2e88, 0 10px 30px #000c; transform: rotate(-3deg); }
  #keys { font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif; font-size: 13px; letter-spacing: .04em; color: #aab0bb;
    background: #0c0d10b8; border: 1px solid #ffffff14; border-radius: 0; }
</style>
</head>
<body>
  <div id="viewport"></div>
  <canvas id="gesture"></canvas>
  <div id="padhint"><span>TRICK PAD — hold to wind up, flick up to ollie · sides: swipe down = push · in air: hold screen edge = spin</span></div>
  <div id="hud">booting…</div>
  <div id="keys"></div>
  <div id="trickname"></div>
  <div id="creatorbar">
    <span id="riderTag"></span>
    <button id="stanceRegular">Regular</button>
    <button id="stanceGoofy">Goofy</button>
    <button id="openCreator">Menu</button>
  </div>
  <div id="creator"></div>
  <div id="attrib">Powered by creategamecharacters.com</div>
  <div id="loading"><div>Loading rider…</div><div id="loadmsg" style="font-size:12px;color:#67707f"></div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/",
    "three-mesh-bvh": "https://unpkg.com/three-mesh-bvh@0.8.3/build/index.module.js"
  }
}
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
